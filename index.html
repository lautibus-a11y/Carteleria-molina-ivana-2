<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartelera - Ivana Molina & Asociados (Modo Negro)</title>
    <!-- Favicon con el logo oficial -->
    <link rel="icon" type="image/png" href="assets/logo.png">
    <!-- Tailwind CSS para la estructura y estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter para un look moderno y limpio -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden; /* Evita cualquier tipo de desplazamiento */
            background-color: #000;
        }
        /* Aseguramos que no haya selección de texto ni interacciones accidentales */
        * {
            user-select: none;
            -webkit-user-drag: none;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col relative">

    <!-- CABECERA SUPERIOR -->
    <header class="absolute top-0 left-0 w-full bg-gradient-to-b from-black/80 via-black/40 to-transparent h-36 px-12 flex justify-between items-center z-20 pointer-events-none">
        <!-- Logo en tamaño prominente y legible para Smart TV -->
        <img src="assets/logo.png" alt="Ivana Molina & Asociados" class="h-28 w-28 object-contain drop-shadow-lg">
        
        <div id="status-badge" class="border border-white/70 px-5 py-2 text-base tracking-widest uppercase text-white rounded bg-black/30 backdrop-blur-sm shadow-md">
            En Venta
        </div>
    </header>

    <!-- ZONA CENTRAL (FOTOGRAFÍA) -->
    <!-- Utilizamos Canvas para dibujar las imágenes y procesar los fundidos suavemente -->
    <main id="canvas-container" class="flex-grow relative bg-black w-full h-full overflow-hidden">
        <canvas id="photo-canvas" class="absolute inset-0 w-full h-full block"></canvas>
    </main>

    <!-- FRANJA INFERIOR (MODO NEGRO) -->
    <footer class="bg-[#121214] text-white py-6 min-h-[140px] px-10 flex justify-between items-center flex-shrink-0 z-10 border-t border-zinc-800 shadow-[0_-4px_20px_rgba(0,0,0,0.6)]">
        <div class="flex flex-col justify-center gap-1.5">
            <h2 id="prop-title" class="text-3xl font-semibold tracking-wide text-white transition-opacity duration-500">
                Cargando propiedades...
            </h2>
            <div id="prop-location" class="flex items-center gap-2 text-zinc-400 text-lg tracking-wide transition-opacity duration-500">
                Ubicación
            </div>
            <div id="prop-features" class="flex items-center gap-6 text-zinc-400 text-base tracking-wide transition-opacity duration-500 mt-1">
                Detalles
            </div>
        </div>
        <div class="flex flex-col justify-center items-end">
            <span id="prop-price" class="text-5xl font-light tracking-tight text-white transition-opacity duration-500">
                --
            </span>
        </div>
    </footer>

    <!-- Carga de la lista de propiedades reales -->
    <script src="propiedades.js"></script>

    <script>
        /**
         * Fallback de propiedades por defecto (en caso de que no cargue propiedades.js)
         */
        const defaultProperties = [
            {
                title: "Residencia Minimalista con Piscina",
                location: "Barrio Privado Los Álamos, Zona Norte",
                m2: "450 m²",
                ambientes: "6 Amb.",
                dormitorios: "4 Dorm.",
                custom: "Piscina Climatizada",
                price: "USD 850.000",
                status: "EN VENTA",
                images: [
                    "https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=1920&q=80",
                    "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1920&q=80",
                    "https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?auto=format&fit=crop&w=1920&q=80"
                ]
            }
        ];

        // Cargar propiedades reales desde propiedades.js o fallback
        const propList = (typeof properties !== 'undefined' && Array.isArray(properties) && properties.length > 0)
            ? properties
            : defaultProperties;

        // Configuración de tiempos
        const TIME_PER_SLIDE = 7000; // 7 segundos por foto
        const FADE_DURATION = 1500;  // 1.5 segundos de transición de fundido

        // Variables de estado
        let currentPropIndex = 0;
        let currentImageIndex = 0;
        
        // Elementos del DOM
        const canvas = document.getElementById('photo-canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        
        // Elementos de texto
        const elTitle = document.getElementById('prop-title');
        const elLocation = document.getElementById('prop-location');
        const elFeatures = document.getElementById('prop-features');
        const elPrice = document.getElementById('prop-price');
        const elStatus = document.getElementById('status-badge');

        // Caché de imágenes para evitar parpadeos y cargas lentas durante la presentación
        const imageCache = {};

        // Variables para la animación de fundido (crossfade)
        let currentImgObj = null;
        let nextImgObj = null;
        let isFading = false;
        let fadeStartTime = 0;

        /**
         * Ajusta el tamaño del canvas al tamaño real de la pantalla
         */
        function resizeCanvas() {
            canvas.width = container.clientWidth || window.innerWidth;
            canvas.height = container.clientHeight || (window.innerHeight - 140);
            drawStatic(); // Redibujar si redimensionamos la ventana
        }
        window.addEventListener('resize', resizeCanvas);

        /**
         * Dibuja una imagen en el canvas emulando "object-fit: cover" de CSS
         * Asegura que la imagen ocupe todo el espacio sin deformarse.
         */
        function drawImageCover(context, img, alpha = 1.0) {
            if (!img) return;

            const canvasRatio = canvas.width / canvas.height;
            const imgRatio = (img.width || 1920) / (img.height || 1080);
            let renderW, renderH, renderX, renderY;

            if (imgRatio < canvasRatio) {
                // La imagen es más estrecha que el canvas (ajustar por ancho)
                renderW = canvas.width;
                renderH = canvas.width / imgRatio;
                renderX = 0;
                renderY = (canvas.height - renderH) / 2;
            } else {
                // La imagen es más ancha que el canvas (ajustar por alto)
                renderW = canvas.height * imgRatio;
                renderH = canvas.height;
                renderX = (canvas.width - renderW) / 2;
                renderY = 0;
            }

            context.globalAlpha = alpha;
            context.drawImage(img, renderX, renderY, renderW, renderH);
            context.globalAlpha = 1.0; // Resetear alfa
        }

        /**
         * Precarga una imagen y retorna una Promesa segura
         */
        function preloadImage(url) {
            return new Promise((resolve) => {
                if (!url) return resolve(null);
                if (imageCache[url]) {
                    resolve(imageCache[url]);
                    return;
                }
                const img = new Image();
                if (url.startsWith('http://') || url.startsWith('https://')) {
                    img.crossOrigin = "Anonymous"; // Solo para URLs web
                }
                img.onload = () => {
                    imageCache[url] = img;
                    resolve(img);
                };
                img.onerror = () => {
                    console.warn("No se pudo cargar la imagen:", url);
                    resolve(null); // Resolvemos null para no frenar la ejecución
                };
                img.src = url;
            });
        }

        /**
         * Actualiza los datos de la franja inferior (HTML DOM)
         */
        function updateDOMInfo(prop) {
            if (!prop) return;

            elTitle.style.opacity = 0;
            elLocation.style.opacity = 0;
            elFeatures.style.opacity = 0;
            elPrice.style.opacity = 0;
            elStatus.style.opacity = 0;

            setTimeout(() => {
                elTitle.textContent = prop.title || "";
                
                // Línea 2: Ubicación
                elLocation.innerHTML = `
                    <svg class="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.243-4.243a8 8 0 1111.314 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    <span>${prop.location || ""}</span>
                `;
                
                // Línea 3: Características (m2, Ambientes, Dormitorios, Custom)
                let featuresHTML = '';
                if (prop.m2) {
                    featuresHTML += `
                        <span class="flex items-center gap-1.5">
                            <svg class="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                            ${prop.m2}
                        </span>
                    `;
                }
                if (prop.ambientes) {
                    featuresHTML += `
                        <span class="flex items-center gap-1.5">
                            <svg class="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                            ${prop.ambientes}
                        </span>
                    `;
                }
                if (prop.dormitorios) {
                    featuresHTML += `
                        <span class="flex items-center gap-1.5">
                            <svg class="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 7v11m0-4h18m0 4v-8a2 2 0 00-2-2h-8v6m-4 0v-4a1 1 0 011-1h2a1 1 0 011 1v4"></path></svg>
                            ${prop.dormitorios}
                        </span>
                    `;
                }
                if (prop.custom) {
                    const isTree = /espacio verde|verde|arboleda|parque|jard[ií]n|terreno/i.test(prop.custom);
                    const isPool = /pileta|piscina/i.test(prop.custom);
                    let customIcon = `<svg class="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 13l4 4L19 7"></path></svg>`;
                    
                    if (isTree) {
                        customIcon = `<svg class="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 19a4 4 0 0 1-2.24-7.32A3.5 3.5 0 0 1 9 6.03V6a3 3 0 0 1 6 0v.04a3.5 3.5 0 0 1 3.24 5.65A4 4 0 0 1 16 19ZM12 19v3"></path></svg>`;
                    } else if (isPool) {
                        customIcon = `<svg class="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 20c1.5 0 2.5-1 4.5-1s3 1 4.5 1 3-1 4.5-1 3 1 4.5 1M3 16c1.5 0 2.5-1 4.5-1s3 1 4.5 1 3-1 4.5-1 3 1 4.5 1M7 15V6a2 2 0 012-2h1a2 2 0 012 2v9M7 9h5M7 13h5"></path></svg>`;
                    }

                    featuresHTML += `
                        <span class="flex items-center gap-1.5 font-medium text-zinc-200">
                            ${customIcon}
                            ${prop.custom}
                        </span>
                    `;
                }
                elFeatures.innerHTML = featuresHTML || '<span></span>';
                
                elPrice.textContent = prop.price || "--";
                elStatus.textContent = prop.status || "EN VENTA";

                elTitle.style.opacity = 1;
                elLocation.style.opacity = 1;
                elFeatures.style.opacity = 1;
                elPrice.style.opacity = 1;
                elStatus.style.opacity = 1;
            }, 300); // Pequeño delay para que coincida visualmente el texto
        }

        /**
         * Bucle de animación manejado por requestAnimationFrame
         * Se encarga del fundido entre imágenes.
         */
        function animateFade(timestamp) {
            if (!fadeStartTime) fadeStartTime = timestamp;
            const elapsed = timestamp - fadeStartTime;
            
            // Limpiar canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (isFading) {
                const progress = Math.min(elapsed / FADE_DURATION, 1.0);
                
                // Dibujar imagen anterior de fondo
                if (currentImgObj) {
                    drawImageCover(ctx, currentImgObj, 1.0);
                }
                
                // Dibujar nueva imagen por encima con opacidad progresiva
                if (nextImgObj) {
                    drawImageCover(ctx, nextImgObj, progress);
                }

                if (progress < 1.0) {
                    requestAnimationFrame(animateFade);
                } else {
                    // Fin del fundido
                    isFading = false;
                    currentImgObj = nextImgObj;
                    drawStatic();
                }
            }
        }

        /**
         * Dibuja la imagen actual sin animaciones (estado de reposo)
         */
        function drawStatic() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            if (currentImgObj) {
                drawImageCover(ctx, currentImgObj, 1.0);
            }
        }

        /**
         * Lógica principal para avanzar al siguiente slide
         */
        async function nextSlide() {
            if (!propList || propList.length === 0) return;
            const currentProp = propList[currentPropIndex];
            
            // Avanzar índices
            currentImageIndex++;
            let propChanged = false;

            // Si terminamos las fotos de esta propiedad, pasamos a la siguiente
            if (currentImageIndex >= currentProp.images.length) {
                currentImageIndex = 0;
                currentPropIndex++;
                propChanged = true;
                
                // Si terminamos todas las propiedades, volvemos a la primera (loop infinito)
                if (currentPropIndex >= propList.length) {
                    currentPropIndex = 0;
                }
            }

            const newProp = propList[currentPropIndex];
            const nextImageUrl = newProp.images[currentImageIndex];

            // Precargar la imagen que sigue
            nextImgObj = await preloadImage(nextImageUrl);

            // Si la imagen no pudo cargar, saltar a la siguiente tras un breve momento
            if (!nextImgObj) {
                setTimeout(nextSlide, 1000);
                return;
            }

            // Actualizar textos si cambió la propiedad
            if (propChanged) {
                updateDOMInfo(newProp);
            }

            // Iniciar animación de fundido
            isFading = true;
            fadeStartTime = 0; // Resetear tiempo para la nueva animación
            requestAnimationFrame(animateFade);
        }

        /**
         * Alternar pantalla completa al presionar la tecla 'F'
         */
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            }
        });

        /**
         * Inicializar la cartelera
         */
        async function initApp() {
            resizeCanvas();
            
            // Cargar primera propiedad e imagen
            const prop = propList[0];
            updateDOMInfo(prop);
            
            const firstImgUrl = prop.images[0];
            currentImgObj = await preloadImage(firstImgUrl);
            drawStatic();

            // Precargar la siguiente imagen por adelantado para evitar lag
            if (prop.images.length > 1) {
                preloadImage(prop.images[1]);
            }

            // Iniciar el ciclo de 7 segundos
            setInterval(nextSlide, TIME_PER_SLIDE);
        }

        // Arrancar la aplicación cuando la ventana cargue
        window.onload = initApp;

    </script>
</body>
</html>
